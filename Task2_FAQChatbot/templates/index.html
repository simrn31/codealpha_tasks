<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAQ Chatbot</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --bubble-bot: #232842;
    --bubble-user: #4f7cff;
    --text: #e9ecff;
    --muted: #8890b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    height: 90vh;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid #2a2f4a;
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }
  form {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #2a2f4a;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: #0f1220;
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: 2px solid var(--bubble-user); }
  button {
    background: var(--bubble-user);
    color: white;
    border: none;
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 FAQ Assistant</h1>
      <p>Ask me anything about attendance, fees, hostel, placements...</p>
    </header>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="user-input" type="text" placeholder="Type your question..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');

function addMessage(text, sender, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

addMessage("Hi! I'm your FAQ assistant. Ask me a question to get started.", 'bot');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    const confidencePct = Math.round((data.score || 0) * 100);
    addMessage(data.answer, 'bot', data.matched_question ? `Confidence: ${confidencePct}%` : null);
  } catch (err) {
    addMessage("Something went wrong reaching the server.", 'bot');
  }
});
</script>
</body>
</html>
